<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de cortes de media res</title>
<!--
  MAPA DE CORTES · referencia para el agente

  Solo el mapa. Los kilos vienen de afuera (la app ya los tiene):
    MapaCortes.render(svg, { kgPorCorte, seleccionado, onSeleccion })

  - kgPorCorte:  { asado: 11, nalga: 6, cuadrada: 2.5, ... }  (ids de CORTE_A_ZONA)
  - seleccionado: id de corte o null. Su zona se marca con borde negro.
  - onSeleccion:  función(idCorte) que se llama al tocar una zona.

  Cómo funciona:
  1. ZONAS: polígonos con coordenadas fijas en un viewBox de 620 x 340
     (cabeza a la izquierda). NO reinventar las coordenadas.
  2. CORTE_A_ZONA: varios cortes pueden compartir zona
     (nalga + cuadrada + tapa de nalga -> "nalga"). Picada no tiene zona.
  3. COLOR: se suman los kg por zona; la zona más pesada es la más oscura.
     t = kg_zona / kg_max -> mezcla(claro, oscuro, 0.12 + 0.88 * t).
     Si t > 0.5 el texto va en blanco.
  4. ORDEN DE DIBUJO: silueta gris -> zonas -> textos.
-->
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 24px; font-family: "Public Sans", sans-serif; background: #FFFFFF; }
  .mapa-cortes { width: 100%; max-width: 720px; height: auto; display: block; margin: 0 auto; }
  .mapa-cortes polygon.zona { cursor: pointer; transition: fill 0.2s; }
  .mapa-cortes polygon.zona:focus { outline: none; }
  .mapa-cortes polygon.zona:focus-visible { stroke: #2F5D8A; stroke-width: 4; }
  .mapa-cortes text { pointer-events: none; font-family: "Public Sans", sans-serif; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .mapa-cortes polygon.zona { transition: none; } }
</style>
</head>
<body>

<svg id="mapa" class="mapa-cortes" viewBox="0 0 620 340" role="group" aria-label="Esquema de la media res con los cortes coloreados según su peso"></svg>

<script>
const MapaCortes = (() => {
  // Silueta de fondo: tapa los huecos entre zonas.
  const SILUETA = "40,90 110,58 210,50 480,44 555,50 578,110 560,150 552,215 548,215 540,312 505,312 492,215 470,210 440,234 255,247 165,252 160,312 128,312 120,252 85,242 68,195 44,160";

  const ZONAS = [
    { id: "cogote",      nombre: "Cogote",        poligonos: ["40,90 110,60 120,180 70,195 45,160"],      etiquetas: [{ x: 80,  y: 140, size: 11 }] },
    { id: "aguja",       nombre: "Aguja",         poligonos: ["110,60 210,52 210,128 115,132"],           etiquetas: [{ x: 160, y: 98,  size: 12 }] },
    { id: "bifeAncho",   nombre: "Bife ancho",    poligonos: ["210,52 290,50 290,125 210,128"],           etiquetas: [{ x: 250, y: 94,  size: 11 }] },
    { id: "bifeAngosto", nombre: "Bife angosto",  poligonos: ["290,50 390,50 390,102 290,104"],           etiquetas: [{ x: 340, y: 82,  size: 11 }] },
    { id: "cuadril",     nombre: "Cuadril",       poligonos: ["390,50 480,46 480,100 390,102"],           etiquetas: [{ x: 435, y: 80,  size: 12 }] },
    { id: "lomo",        nombre: "Lomo",          poligonos: ["290,104 480,100 480,122 290,126"],         etiquetas: [{ x: 385, y: 117, size: 10 }] },
    { id: "nalga",       nombre: "Nalga",         poligonos: ["480,46 555,52 575,110 560,150 480,150"],   etiquetas: [{ x: 525, y: 104, size: 12 }] },
    { id: "bola",        nombre: "Bola / Peceto", poligonos: ["480,150 560,150 552,215 490,215"],         etiquetas: [{ x: 521, y: 186, size: 10 }] },
    { id: "paleta",      nombre: "Paleta",        poligonos: ["115,132 210,128 215,198 160,198 120,180"], etiquetas: [{ x: 165, y: 168, size: 12 }] },
    { id: "pecho",       nombre: "Pecho",         poligonos: ["70,195 120,180 160,198 155,250 85,240"],   etiquetas: [{ x: 115, y: 222, size: 11 }] },
    { id: "asado",       nombre: "Asado",         poligonos: ["210,128 330,125 335,190 215,198"],         etiquetas: [{ x: 272, y: 165, size: 12 }] },
    { id: "vacio",       nombre: "Vacío",         poligonos: ["330,125 480,122 480,150 470,198 335,190"], etiquetas: [{ x: 405, y: 163, size: 12 }] },
    { id: "falda",       nombre: "Falda",         poligonos: ["160,198 215,198 260,196 255,245 155,250"], etiquetas: [{ x: 208, y: 226, size: 11 }] },
    { id: "matambre",    nombre: "Matambre",      poligonos: ["260,196 335,190 470,198 440,232 255,245"], etiquetas: [{ x: 350, y: 220, size: 11 }] },
    { id: "osobuco",     nombre: "Osobuco",       poligonos: ["122,252 163,252 158,310 130,310", "494,217 550,217 540,310 506,310"],
                                                   etiquetas: [{ x: 144, y: 330, size: 11, fuera: true }, { x: 523, y: 330, size: 11, fuera: true }] }
  ];

  // Qué zona pinta cada corte. Adaptar los ids a los de tu base de datos.
  const CORTE_A_ZONA = {
    cuadril: "cuadril", lomo: "lomo", bifeAngosto: "bifeAngosto",
    nalga: "nalga", cuadrada: "nalga", tapaNalga: "nalga",
    bola: "bola", peceto: "bola",
    vacio: "vacio", matambre: "matambre", osobuco: "osobuco",
    asado: "asado", tapaAsado: "asado", falda: "falda",
    bifeAncho: "bifeAncho", aguja: "aguja",
    paleta: "paleta", marucha: "paleta",
    pecho: "pecho", cogote: "cogote",
    picada: null
  };

  const NS = "http://www.w3.org/2000/svg";

  function kgPorZona(kgPorCorte) {
    const total = {};
    for (const [corte, kg] of Object.entries(kgPorCorte || {})) {
      const zona = CORTE_A_ZONA[corte];
      if (!zona || !(kg > 0)) continue;
      total[zona] = (total[zona] || 0) + kg;
    }
    return total;
  }

  function mezclar(t) {
    const claro = [246, 228, 224], oscuro = [110, 20, 20];
    return `rgb(${claro.map((v, i) => Math.round(v + (oscuro[i] - v) * t)).join(",")})`;
  }

  function colorZona(kg, kgMax) {
    if (!kg || kgMax <= 0) return { relleno: "#EEECEA", texto: "#1C1917" };
    const t = kg / kgMax;
    return { relleno: mezclar(0.12 + 0.88 * t), texto: t > 0.5 ? "#FFFFFF" : "#1C1917" };
  }

  function crear(tag, attrs) {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  }

  function formatear(n) {
    return n.toLocaleString("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }

  function render(svg, { kgPorCorte = {}, seleccionado = null, onSeleccion = null } = {}) {
    svg.replaceChildren();
    const porZona = kgPorZona(kgPorCorte);
    const kgMax = Math.max(0, ...Object.values(porZona));
    const zonaSel = seleccionado ? CORTE_A_ZONA[seleccionado] : null;

    // a) silueta
    svg.appendChild(crear("polygon", { points: SILUETA, fill: "#E7E5E4" }));

    // b) zonas
    for (const z of ZONAS) {
      const { relleno } = colorZona(porZona[z.id], kgMax);
      const activa = z.id === zonaSel;
      const elegir = () => {
        if (!onSeleccion) return;
        const primero = Object.keys(CORTE_A_ZONA).find(c => CORTE_A_ZONA[c] === z.id);
        if (primero) onSeleccion(primero);
      };
      for (const pts of z.poligonos) {
        const p = crear("polygon", {
          points: pts,
          fill: relleno,
          stroke: activa ? "#111111" : "#FFFFFF",
          "stroke-width": activa ? 4 : 1.5,
          "stroke-linejoin": "round",
          class: "zona",
          tabindex: "0",
          role: "button",
          "aria-label": `${z.nombre}: ${formatear(porZona[z.id] || 0)} kg`
        });
        p.addEventListener("click", elegir);
        p.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); elegir(); }
        });
        svg.appendChild(p);
      }
    }

    // c) textos
    for (const z of ZONAS) {
      const { texto } = colorZona(porZona[z.id], kgMax);
      for (const et of z.etiquetas) {
        const t = crear("text", {
          x: et.x, y: et.y, "font-size": et.size, "text-anchor": "middle",
          fill: et.fuera ? "#57534E" : texto
        });
        t.textContent = z.nombre;
        svg.appendChild(t);
      }
    }
  }

  return { render, ZONAS, CORTE_A_ZONA, SILUETA, colorZona, kgPorZona };
})();

/* ---- Demo: reemplazar por los kilos reales de tu app ---- */
const svg = document.getElementById("mapa");
const kgEjemplo = {
  cuadril: 3, lomo: 1.8, bifeAngosto: 4.5, nalga: 6, cuadrada: 2.5, tapaNalga: 1.2,
  bola: 3, peceto: 1.4, vacio: 3.3, matambre: 1.3, osobuco: 3.5, asado: 11,
  tapaAsado: 1.5, falda: 4, bifeAncho: 4, aguja: 7.5, paleta: 6.5, marucha: 1.5,
  pecho: 3.5, cogote: 3.5, picada: 6.5
};
let sel = null;
function dibujar() {
  MapaCortes.render(svg, {
    kgPorCorte: kgEjemplo,
    seleccionado: sel,
    onSeleccion: id => { sel = sel === id ? null : id; dibujar(); }
  });
}
dibujar();
</script>
</body>
</html>
