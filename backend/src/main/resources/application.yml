spring:
  application:
    name: backend

  datasource:
    url: ${SUPABASE_DB_URL:}
    username: ${SUPABASE_DB_USERNAME:}
    password: ${SUPABASE_DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    # Las migraciones corren con un usuario propio (dueño de las tablas), separado del
    # usuario de runtime (app_backend, sin privilegios de DDL ni de bypass de RLS).
    url: ${SUPABASE_DB_URL:}
    user: ${SUPABASE_DB_MIGRATIONS_USERNAME:}
    password: ${SUPABASE_DB_MIGRATIONS_PASSWORD:}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWT_JWKS_URI:}

server:
  port: ${SERVER_PORT:8080}

app:
  # Orígenes del frontend que pueden llamar a esta API (CORS). En dev, Vite.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
